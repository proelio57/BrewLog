name: BrewLog
options:
  bundleIdPrefix: com.brewlog
  # Marks the project as up to date for this Xcode, so it doesn't show the
  # "Update to recommended settings" dialog. Put recommended settings here instead,
  # because changes Xcode makes to the generated .xcodeproj are lost on regeneration.
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Xcode recommended settings
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  BrewLog:
    type: application
    platform: iOS
    sources:
      - path: BrewLog
      - path: ActivityShared
      - path: Shared
        buildPhase: resources
    dependencies:
      - target: BrewLogWidgets
    entitlements:
      path: BrewLog/BrewLog.entitlements
      properties:
        com.apple.security.application-groups:
          - $(BREWLOG_APP_GROUP)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Live Activities, background modes and the recipe feed URL (merged with the generated keys)
        INFOPLIST_FILE: BrewLog/Info.plist
        BREWLOG_APP_GROUP: group.$(PRODUCT_BUNDLE_IDENTIFIER)
        INFOPLIST_KEY_CFBundleDisplayName: BrewLog
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "BrewLog connects to your Bluetooth coffee scale to read the weight live while you brew."
        INFOPLIST_KEY_NSCameraUsageDescription: "BrewLog uses the camera to photograph your coffee bag and read the details from its label. The photo stays on this device."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "BrewLog connects to your espresso machine (GaggiMate) in your Wi-Fi to record pressure and temperature and to start shots."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
  # Lock Screen / Dynamic Island Live Activity for a running brew
  BrewLogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BrewLogWidgets
      - path: ActivityShared
    entitlements:
      path: BrewLogWidgets/BrewLogWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(BREWLOG_APP_GROUP)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        # App bundle id (from the xcconfig, incl. Local.xcconfig) + suffix, as extensions require
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).LiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: BrewLogWidgets/Info.plist
        # The app's group: the extension's bundle id without ".LiveActivity".
        BREWLOG_APP_GROUP: group.$(PRODUCT_BUNDLE_IDENTIFIER:base)
        INFOPLIST_KEY_CFBundleDisplayName: BrewLog
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        DEAD_CODE_STRIPPING: YES
  BrewLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrewLogTests
    dependencies:
      - target: BrewLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.brewlog.app.tests
        CODE_SIGN_STYLE: Automatic
  BrewLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BrewLogUITests
    dependencies:
      - target: BrewLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.brewlog.app.uitests
        CODE_SIGN_STYLE: Automatic
schemes:
  BrewLogUITests:
    build:
      targets:
        BrewLog: all
        BrewLogUITests: [test]
    test:
      config: Debug
      targets:
        - BrewLogUITests
  BrewLog:
    build:
      targets:
        BrewLog: all
        BrewLogTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - BrewLog
      targets:
        - BrewLogTests
    archive:
      config: Release
