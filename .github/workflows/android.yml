# Builds BrewLog for Android on every push to main, runs unit tests and publishes the APK
# to GitHub Releases so you can update the app via git or directly in-app.
name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "Shared/**"
      - "scripts/build-apk.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "Shared/**"
      - "scripts/build-apk.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Make scripts and gradlew executable
        run: |
          chmod +x android/gradlew
          chmod +x scripts/build-apk.sh

      - name: Version
        id: version
        run: |
          base="0.1"
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        if: vars.SKIP_TESTS != 'true'
        env:
          VERSION_CODE: ${{ steps.version.outputs.build }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          ./android/gradlew -p android testDebugUnitTest

      - name: Decode Keystore (optional)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          cat << EOF > android/keystore.properties
          storeFile=android/keystore/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.build }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
        run: |
          mkdir -p build
          if [ -f "android/keystore.properties" ]; then
            ./android/gradlew -p android assembleRelease
            cp android/app/build/outputs/apk/release/app-release.apk "build/BrewLog-${{ steps.version.outputs.version }}.apk"
          else
            ./android/gradlew -p android assembleDebug
            cp android/app/build/outputs/apk/debug/app-debug.apk "build/BrewLog-${{ steps.version.outputs.version }}.apk"
          fi

      - name: Clean up Keystore
        if: always()
        run: rm -rf android/keystore android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: BrewLog-android-${{ steps.version.outputs.version }}
          path: build/*.apk
          retention-days: 14

      - name: Publish Release APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          apk_file="build/BrewLog-${{ steps.version.outputs.version }}.apk"
          
          # Create or update GitHub release with the APK asset
          if gh release view "$tag" --repo "${RELEASE_REPO}" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk_file" --clobber --repo "${RELEASE_REPO}"
          else
            gh release create "$tag" "$apk_file" \
              --title "BrewLog ${{ steps.version.outputs.version }}" \
              --notes "BrewLog Android release ${{ steps.version.outputs.version }}" \
              --repo "${RELEASE_REPO}"
          fi
